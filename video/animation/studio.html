<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Riso Live studio</title>
<style>
  @font-face { font-family: "Hook"; src: url(assets/fonts/BricolageGrotesque.woff2); font-weight: 200 800; font-display: block; }
  @font-face { font-family: "Serif"; src: url(assets/fonts/InstrumentSerif.woff2); font-style: normal; font-display: block; }
  @font-face { font-family: "Serif"; src: url(assets/fonts/InstrumentSerif-Italic.woff2); font-style: italic; font-display: block; }
  @font-face { font-family: "Pixel"; src: url(assets/fonts/Silkscreen.woff2); font-display: block; }
  @font-face { font-family: "Mono"; src: url(assets/fonts/SpaceMono.woff2); font-weight: 700; font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F4EDDB; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="195" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/config.js"></script>
<script src="src/song.js"></script>
<script src="src/riso/engine.js"></script>
<script src="src/riso/fx.js"></script>
<script src="src/riso/clips.js"></script>
<script src="src/riso/audio.js"></script>
<script src="src/riso/cuts.js"></script>
<!-- chapters, in order -->
<script src="src/riso/scenes/common.js"></script>
<script src="src/riso/scenes/a_intro_v1.js"></script>
<script src="src/riso/scenes/b_chorus.js"></script>
<script src="src/riso/scenes/c_v2_pre.js"></script>
<script src="src/riso/scenes/d_v3_v4.js"></script>
<script src="src/riso/scenes/e_bridge_outro.js"></script>
<script src="src/riso/scenes/f_credits.js"></script>
<script src="src/riso/scenes/y_tribute.js"></script>
<script src="src/riso/scenes/z_overlay.js"></script>
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
